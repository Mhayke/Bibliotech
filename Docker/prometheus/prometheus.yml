global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "bibliotech"
    scrape_interval: 5s
    static_configs:
      - targets: ["biblioteca:8000"]
        labels:
          app: "bibliotech"

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
